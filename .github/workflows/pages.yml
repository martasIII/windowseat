name: Web na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publikace webu
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: dotnet publish src/WindowSeat.Web -c Release -o out
      # Jekyll by jinak zahodil složku _framework.
      - name: Bez Jekyllu
        run: touch out/wwwroot/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot
      - id: deployment
        uses: actions/deploy-pages@v4
